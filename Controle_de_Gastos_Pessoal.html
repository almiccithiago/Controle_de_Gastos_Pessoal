<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
// Anti-cache: garante que o navegador sempre busque a versão mais recente do arquivo,
// adicionando um parâmetro único na URL na primeira visita de cada carregamento.
(function(){
  if(!location.search.includes('_v=')){
    var sep = location.search ? '&' : '?';
    location.replace(location.pathname + location.search + sep + '_v=' + Date.now());
  }
})();
</script>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Gastos Pessoal</title>
<style>
  :root{
    --navy: #0F2A4A;
    --navy-deep: #081A2E;
    --navy-soft: #17395F;
    --teal: #12A9A6;
    --blue: #2F6FED;
    --purple: #7C5CFC;
    --orange: #FF8A3D;
    --pink: #FF5C93;
    --amber: #F5B301;
    --green: #1FAA59;
    --red: #E5484D;
    --bg: #F2F5F9;
    --card: #FFFFFF;
    --text: #1B2430;
    --muted: #6B7684;
    --border: #E4E8EE;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header.topbar{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: #fff;
    padding: 0;
    box-shadow: 0 4px 18px rgba(8,26,46,0.25);
    position: sticky;
    top:0;
    z-index: 50;
  }
  .topbar-inner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 24px 0 24px;
  }
  .brand{ display:flex; align-items:center; gap:14px; margin-bottom: 14px; flex-wrap:wrap; row-gap:8px; }
  .brand-text{ flex:1; min-width:0; }
  #logout-btn{
    background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25); color:#fff;
    border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
    flex-shrink:0; transition: background .15s ease;
  }
  #logout-btn:hover{ background: rgba(255,255,255,0.2); }
  .save-status{
    font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:8px; flex-shrink:0;
    white-space:nowrap; opacity:0; transition:opacity .2s ease;
  }
  .save-status.show{ opacity:1; }
  .save-status.saving{ color:#F5B301; }
  .save-status.saved{ color:#5FE0A0; }
  .save-status.error{ color:#FF8A8A; background:rgba(229,72,77,0.15); }
  #export-btn, #import-btn{
    background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25); color:#fff;
    border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
    flex-shrink:0; transition: background .15s ease; white-space:nowrap;
  }
  #export-btn:hover, #import-btn:hover{ background: rgba(255,255,255,0.2); }
  .brand-mark{
    width:42px;height:42px;border-radius:10px;
    background: linear-gradient(135deg, var(--teal), var(--blue));
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; letter-spacing:0.5px;
    box-shadow: 0 3px 10px rgba(18,169,166,0.4);
  }
  .brand-text h1{ font-size: 19px; margin:0; font-weight:700; letter-spacing:0.2px;}
  .brand-text p{ font-size: 12px; margin:2px 0 0 0; color: #A9BBD1; }
  nav.tabs{
    display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    background:transparent; border:none; color:#B9C8DA;
    padding: 10px 16px; font-size: 13.5px; font-weight:600; cursor:pointer;
    white-space:nowrap; border-bottom: 3px solid transparent;
    transition: all .15s ease;
  }
  nav.tabs button:hover{ color:#fff; }
  nav.tabs button.active{
    color:#fff; border-bottom-color: var(--teal);
  }
  nav.tabs button#add-month-tab{
    color: var(--teal); font-weight:800; margin-left:4px;
  }
  nav.tabs button#add-month-tab:hover{ color:#5FD9D6; }
  nav.tabs button.tab-modelo{ font-style:italic; }
  nav.tabs button.tab-modelo::before{ content:"⚙ "; font-style:normal; }
  nav.tabs button[draggable="true"]{ cursor:grab; }
  nav.tabs button[draggable="true"]:active{ cursor:grabbing; }
  nav.tabs button.dragging{ opacity:0.4; }
  nav.tabs button.drag-over{ box-shadow: inset 0 -3px 0 var(--orange); background: rgba(255,138,61,0.12); }
  main{ max-width: 1180px; margin: 0 auto; padding: 22px 24px 80px 24px; }

  .month-title-bar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .month-title-bar h2{ font-size:20px; margin:0; color:var(--navy); }
  #delete-month-btn{
    background:transparent; border:1px solid var(--red); color:var(--red);
    border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  #delete-month-btn:hover{ background:var(--red); color:#fff; }
  .summary-grid{
    display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; margin-bottom: 20px;
  }
  @media (max-width: 900px){ .summary-grid{ grid-template-columns: repeat(2,1fr);} }
  .summary-card{
    background: var(--card); border-radius: var(--radius); padding: 14px 16px;
    border: 1px solid var(--border);
    position:relative; overflow:hidden;
  }
  .summary-card .label{ font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
  .summary-card .value{ font-size:20px; font-weight:800; margin-top:4px; }
  .summary-card .comparativo{ font-size:11px; font-weight:700; margin-top:4px; }
  .summary-card.accent-teal{ border-top:3px solid var(--teal); }
  .summary-card.accent-blue{ border-top:3px solid var(--blue); }
  .summary-card.accent-green{ border-top:3px solid var(--green); }
  .summary-card.accent-red{ border-top:3px solid var(--red); }
  .summary-card.accent-amber{ border-top:3px solid var(--amber); }
  .value.negative{ color: var(--red); }
  .value.positive{ color: var(--green); }

  .recebimentos-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:20px;}
  @media (max-width:700px){ .recebimentos-row{ grid-template-columns: 1fr; } }
  .receb-card{
    background: linear-gradient(135deg, var(--navy-soft), var(--navy));
    color:#fff; border-radius: var(--radius); padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .receb-card .rlabel{ font-size:12.5px; color:#B9C8DA; font-weight:600; text-transform:uppercase;}
  .receb-card .rlabel-input{
    font-size:12.5px; color:#B9C8DA; font-weight:600; text-transform:uppercase;
    border:none; background:transparent; font-family:inherit; padding:2px 2px;
    width:190px; max-width:55%; text-align:left; -webkit-appearance:none; appearance:none;
  }
  .receb-card .rlabel-input:focus{ outline:1px solid rgba(255,255,255,0.4); border-radius:4px; color:#fff; }
  .receb-prefix{ font-size:13px; font-weight:700; color:#B9C8DA; }
  .receb-card input{
    background: rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
    color:#fff; font-size:17px; font-weight:700; border-radius:8px; padding:6px 10px;
    width:130px; text-align:right;
  }
  .receb-card input:focus{ outline:2px solid var(--teal); }
  .receb-card.receb-zero{
    background: linear-gradient(135deg, #D6555C, #B23037);
    box-shadow: 0 4px 14px rgba(178,48,55,0.35);
  }
  .receb-card.receb-zero .rlabel{ color:#FFE1E2; }
  .receb-card.receb-zero .rlabel-input{ color:#FFE1E2; }
  .receb-card.receb-zero .receb-prefix{ color:#FFE1E2; }
  .receb-card.receb-zero input{ background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.3); }

  .sections-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 900px){ .sections-grid{ grid-template-columns:1fr; } }

  .section-card{
    background: var(--card); border-radius: var(--radius); border:1px solid var(--border);
    padding: 16px; display:flex; flex-direction:column;
  }
  .section-card.detail{ background: #FAFBFD; border-style:dashed; }
  .section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .section-header h3{ font-size:14.5px; margin:0; font-weight:700; }
  .detail-title-input{
    font-size:14.5px; font-weight:700; color:var(--text); border:none; background:transparent;
    padding:2px 2px; width:100%; font-family:inherit;
  }
  .detail-title-input:focus{ outline:1px solid var(--blue); border-radius:4px; }
  .section-header .pill{
    font-size:11px; font-weight:700; color:#fff; background:var(--teal);
    padding: 3px 9px; border-radius:99px;
  }
  .detail-note{ font-size:11px; color:var(--muted); margin: -4px 0 10px 0; font-style:italic; }

  .section-header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .block-remove{
    border:none; background:transparent; color:var(--muted); cursor:pointer;
    font-size:17px; line-height:1; padding:2px 4px; opacity:0.55; flex-shrink:0;
    transition: color .15s ease, opacity .15s ease;
  }
  .block-remove:hover{ color:var(--red); opacity:1; }
  .blocos-ocultos-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .block-restore{
    background:#F0F2F5; border:1px dashed var(--border); color:var(--muted);
    border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .block-restore:hover{ background:#E4E8EE; color:var(--text); }

  .item-row{
    display:flex; align-items:center; gap:8px; padding:7px 4px;
    border-bottom: 1px solid var(--border);
  }
  .item-row:last-of-type{ border-bottom:none; }
  .item-row{ border-radius:8px; transition: background .15s ease, opacity .15s ease; }
  .item-row.paid{ background: #EEF0F3; }
  .item-row.paid .item-desc,
  .item-row.paid .item-valor,
  .item-row.paid .rs-prefix{ color:#A6AEB9; opacity:0.6; }
  .item-row input[type=checkbox]{
    width:20px; height:20px; accent-color: var(--green); cursor:pointer; flex-shrink:0;
  }
  .item-desc{
    flex:1; border:none; background:transparent; font-size:13.5px; color:var(--text);
    padding:4px 2px; min-width:0;
  }
  .item-desc:focus{ outline: 1px solid var(--blue); border-radius:4px; }
  .rs-prefix{ font-size:12px; font-weight:700; color:var(--muted); flex-shrink:0; }
  .rs-prefix-dark{ font-size:13px; font-weight:700; color:var(--navy); }
  .item-valor{
    width: 78px; text-align:right; border:none; background:transparent;
    font-size:13.5px; font-weight:700; color:var(--text); padding:4px 2px;
  }
  .item-valor:focus{ outline:1px solid var(--blue); border-radius:4px; }
  .item-remove{
    border:none; background:transparent; color: var(--red); cursor:pointer;
    font-size:16px; line-height:1; padding:2px 4px; flex-shrink:0; opacity:0.6;
  }
  .item-remove:hover{ opacity:1; }

  .section-total{
    display:flex; justify-content:space-between; margin-top:10px; padding-top:8px;
    border-top: 2px solid var(--border); font-weight:800; font-size:14px;
  }
  .add-item-row{ display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .add-item-row input{
    border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:13px;
  }
  .add-item-row input.add-desc{ flex:1; min-width:0; }
  .add-item-row input.add-valor{ width:85px; }
  .add-item-row button{
    background: var(--teal); color:#fff; border:none; border-radius:8px;
    padding: 6px 12px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .add-item-row button:hover{ background:#0E8F8C; }

  .saldo-banner{
    margin-top: 18px; padding: 14px 18px; border-radius: var(--radius);
    display:flex; justify-content:space-between; align-items:center;
    font-weight:700; font-size:14px;
  }
  .saldo-banner.pos{ background: rgba(31,170,89,0.1); color: #157a3f; border:1px solid rgba(31,170,89,0.3); }
  .saldo-banner.neg{ background: rgba(229,72,77,0.1); color: #b23337; border:1px solid rgba(229,72,77,0.3); }

  /* Emprestimos */
  .emprestimos-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  @media (max-width:900px){ .emprestimos-grid{ grid-template-columns:1fr; } }
  .loan-card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:16px; }
  .loan-card h3{ margin:0 0 4px 0; font-size:15.5px; }
  .loan-title-input{
    margin:0 0 4px 0; font-size:15.5px; font-weight:700; color:var(--text); border:none; background:transparent;
    padding:2px 2px; width:100%; font-family:inherit; display:block;
  }
  .loan-title-input:focus{ outline:1px solid var(--blue); border-radius:4px; }
  .loan-card .loan-sub{ font-size:12px; color:var(--muted); margin-bottom:12px; }
  .loan-inicial-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#F4F6F9; border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; margin-bottom:14px;
  }
  .loan-inicial-row span{ font-size:12px; font-weight:700; color:var(--navy); }
  .loan-inicial-row input{
    border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:13px;
    font-weight:700; width:120px; text-align:right; background:#fff;
  }
  table.loan-table{ width:100%; border-collapse: collapse; font-size:12.5px; }
  table.loan-table th{
    text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--muted);
    padding: 6px 4px; border-bottom:2px solid var(--border);
  }
  table.loan-table td{ padding: 5px 4px; border-bottom:1px solid var(--border); vertical-align:middle;}
  .cell-currency{ display:inline-flex; align-items:center; gap:4px; width:100%; }
  table.loan-table tr.paid{ background:#EEF0F3; }
  table.loan-table tr.paid td{ color:#A6AEB9; }
  table.loan-table th.nowrap{ white-space:nowrap; }
  .loan-saldo{ font-weight:700 !important; }
  table.loan-table input{ border:none; background:transparent; font-size:12.5px; width:100%; padding:3px; }
  table.loan-table input:focus{ outline:1px solid var(--blue); border-radius:4px; }
  table.loan-table input[type=number]{ text-align:right; }
  table.loan-table input[type=checkbox]{ accent-color: var(--green); width:16px; height:16px;}
  .cell-currency input{ flex:1; min-width:0; width:auto; }
  .loan-remove{ border:none;background:transparent;color:var(--red);cursor:pointer;font-size:15px;opacity:.6;}
  .loan-remove:hover{ opacity:1; }
  .loan-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .loan-add-btn{
    background: var(--purple); color:#fff; border:none; border-radius:8px; padding:6px 12px;
    font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .loan-current{ font-weight:800; font-size:14px; color:var(--navy); }

  .empty-hint{ font-size:12.5px; color:var(--muted); padding: 10px 4px; font-style:italic; }
  .footer-note{ text-align:center; font-size:11.5px; color:var(--muted); margin-top: 30px; }

  #lock-screen{
    position:fixed; inset:0; z-index:100;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .lock-card{
    background:#fff; border-radius:18px; padding:36px 32px; width:320px; max-width:88vw;
    text-align:center; box-shadow: 0 20px 50px rgba(8,26,46,0.35);
  }
  .lock-mark{
    width:52px;height:52px;border-radius:14px; margin:0 auto 16px auto;
    background: linear-gradient(135deg, var(--teal), var(--blue));
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:18px; color:#fff;
    box-shadow: 0 4px 14px rgba(18,169,166,0.4);
  }
  .lock-card h2{ font-size:17px; margin:0 0 6px 0; color:var(--text); }
  .lock-card p{ font-size:13px; color:var(--muted); margin:0 0 18px 0; }
  #lock-input{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:11px 14px;
    font-size:15px; text-align:center; letter-spacing:2px; margin-bottom:12px;
  }
  #lock-input:focus{ outline:2px solid var(--teal); border-color:var(--teal); }
  #lock-btn{
    width:100%; background: var(--teal); color:#fff; border:none; border-radius:10px;
    padding:11px 14px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  #lock-btn:hover{ background:#0E8F8C; }
  .lock-error{
    display:none; color: var(--red); font-size:12.5px; margin-top:10px; font-weight:600;
  }

  /* Texto da interface em minúsculo — não afeta o que você digita nos campos */
  h1, h2, h3, button, .label, .rlabel, th, .lock-card p, .lock-card h2,
  .detail-note, .empty-hint, .footer-note, .loan-sub, .loan-current,
  .loan-inicial-row span, .brand-text p, nav.tabs button {
    text-transform: lowercase;
  }
  input, textarea, select { text-transform: none; }

  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:90;
    background: rgba(8,26,46,0.55);
    align-items:center; justify-content:center;
  }
  .modal-card{
    background:#fff; border-radius:16px; padding:28px 26px; width:300px; max-width:88vw;
    box-shadow: 0 20px 50px rgba(8,26,46,0.35);
  }
  .modal-card h3{ margin:0 0 16px 0; font-size:16px; color:var(--navy); }
  .modal-field{ display:block; margin-bottom:14px; }
  .modal-field span{ display:block; font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:5px; }
  .modal-field select, .modal-field input{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:14px;
  }
  .modal-field select:focus, .modal-field input:focus{ outline:2px solid var(--teal); border-color:var(--teal); }
  .modal-error{ display:none; color:var(--red); font-size:12px; font-weight:600; margin-bottom:10px; }
  .modal-actions{ display:flex; gap:8px; margin-top:6px; }
  .modal-btn-secondary, .modal-btn-primary{
    flex:1; border:none; border-radius:8px; padding:10px 12px; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .modal-btn-secondary{ background:#F0F2F5; color:var(--text); }
  .modal-btn-secondary:hover{ background:#E4E8EE; }
  .modal-btn-primary{ background:var(--teal); color:#fff; }
  .modal-btn-primary:hover{ background:#0E8F8C; }

  .annual-card{ margin-bottom:20px; }
  .annual-chart-wrap{ margin: 6px 0 16px 0; }
  table.annual-table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  table.annual-table th{
    text-align:center; font-size:10.5px; text-transform:uppercase; color:var(--muted);
    padding:8px 6px; border-bottom:2px solid var(--border);
  }
  table.annual-table th:first-child, table.annual-table td:first-child{ text-align:left; }
  table.annual-table td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:center; }
  table.annual-table tfoot td{ font-weight:800; border-top:2px solid var(--border); border-bottom:none; }
  .num{ text-align:center; font-weight:700; }
  .num-positive{ color:var(--green); }
  .num-negative{ color:var(--red); }

  .receb-warning{
    background: rgba(245,179,1,0.12); color:#8A6A00; border:1px solid rgba(245,179,1,0.35);
    padding:9px 14px; border-radius:10px; font-size:12.5px; font-weight:600; margin-bottom:18px;
  }

  .month-title-input{
    font-size:20px; font-weight:700; color:var(--navy); border:none; background:transparent;
    padding:2px 4px; font-family:inherit; max-width:340px;
  }
  .month-title-input:focus{ outline:1px solid var(--blue); border-radius:4px; }
</style>
</head>
<body>

<div id="version-badge" style="position:fixed; top:8px; right:10px; z-index:200; background:rgba(0,0,0,0.25); color:rgba(255,255,255,0.85); font-weight:600; font-size:10px; padding:2px 7px; border-radius:6px; font-family:monospace; pointer-events:none;">v2026-07-29.6</div>
<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-mark">SE</div>
    <h2>Controle de Gastos Pessoal</h2>
    <p>Digite a senha para continuar</p>
    <input type="password" id="lock-input" placeholder="Senha" autocomplete="off">
    <button id="lock-btn">Entrar</button>
    <div class="lock-error" id="lock-error">Senha incorreta. Tente novamente.</div>
  </div>
</div>

<div id="app-root" style="display:none;">

let DATA = null;

let currentPassword = '';

async function loadFromServer(){
  const resp = await fetch(`${API_BASE}/api/data/${APP_ID}`, {
    cache: 'no-store',
    headers: { 'x-app-password': currentPassword }
  });
  if(resp.status === 401){
    const err = new Error('Senha incorreta');
    err.isAuthError = true;
    throw err;
  }
  if(!resp.ok) throw new Error('Resposta não OK: ' + resp.status);
  const json = await resp.json();
  if(json.data){
    return migrateData(json.data);
  }
  return migrateData(defaultData());
}

function migrateData(data){
  // migração: garante que monthOrder existe (dados salvos antes dessa versão)
  if(!data.monthOrder){
    const keys = Object.keys(data.months || {});
    data.monthOrder = keys.filter(k=>k!=="Modelo");
  }
  // migração: a aba "Modelo" virou um template interno, não aparece mais como mês
  if(data.months && data.months["Modelo"]){
    if(!data.template) data.template = data.months["Modelo"];
    delete data.months["Modelo"];
  }
  data.monthOrder = data.monthOrder.filter(m=>m!=="Modelo");
  if(!data.template){
    data.template = defaultData().template;
  }
  // migração: a aba "Categorias" foi removida
  delete data.categorias;

  // migração: empréstimos agora usam saldoInicial + cálculo automático em vez de saldo manual por linha
  if(data.emprestimos){
    Object.values(data.emprestimos).forEach(loan=>{
      if(loan.saldoInicial === undefined){
        loan.saldoInicial = (loan.parcelas && loan.parcelas[0] && loan.parcelas[0].saldo !== undefined)
          ? loan.parcelas[0].saldo : 0;
      }
      (loan.parcelas||[]).forEach(p=>{ delete p.saldo; });
    });
  }

  // migração: detalhamentos (NOH / PEDRO-REVOLUT) agora sincronizam com a linha principal
  const guessLinkTo = (titulo)=>{
    const t = titulo.toUpperCase();
    if(t.includes("NOH")) return { list:"dia08", desc:"noh" };
    if(t.includes("PEDRO") || t.includes("REVOLUT")) return { list:"dia18", desc:"revolut" };
    return null;
  };
  const allMonthObjs = [...Object.values(data.months||{}), data.template].filter(Boolean);
  allMonthObjs.forEach(m=>{
    (m.detalhamentos||[]).forEach(det=>{
      if(!det.linkTo) det.linkTo = guessLinkTo(det.titulo||"");
      // migração: box "PEDRO" / "PEDRO / REVOLUT" renomeado para "REVOLUT"
      if(det.titulo === "PEDRO" || det.titulo === "PEDRO / REVOLUT"){
        det.titulo = "REVOLUT";
      }
    });
  });

  // migração: nomes de mês agora incluem o ano (ex: "Agosto/2026"); meses antigos sem "/" recebem 2026
  const monthsSemAno = ["Agosto","Setembro","Outubro","Novembro","Dezembro"];
  monthsSemAno.forEach(nomeAntigo=>{
    if(data.months && data.months[nomeAntigo] && !data.months[nomeAntigo + "/2026"]){
      const novoNome = nomeAntigo + "/2026";
      data.months[novoNome] = data.months[nomeAntigo];
      delete data.months[nomeAntigo];
      data.monthOrder = data.monthOrder.map(m => m === nomeAntigo ? novoNome : m);
    }
  });

  // labels editáveis das caixas (Recebimento Dia 18/08, títulos das seções)
  // — agora são POR MÊS, não mais um valor único global.
  const labelsPadrao = {
    recebDia18: "Recebimento · Dia 18",
    recebDia08: "Recebimento · Dia 08",
    secaoDia18: "DIA 18 · Vencimentos",
    secaoDia08: "DIA 08 · Vencimentos",
  };
  // migração: se existia um valor global antigo, usa ele como ponto de partida pros meses
  const globalAntigo = data.labels || {};
  delete data.labels;
  const aplicarLabels = (m)=>{
    if(!m.labels) m.labels = {};
    Object.keys(labelsPadrao).forEach(k=>{
      if(!m.labels[k]) m.labels[k] = globalAntigo[k] || labelsPadrao[k];
    });
  };
  Object.values(data.months || {}).forEach(aplicarLabels);
  if(data.template) aplicarLabels(data.template);

  return data;
}
function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

function computeLoanSaldos(loan){
  let running = round2(Number(loan.saldoInicial)||0);
  loan.parcelas.forEach(p=>{
    if(p.saldoOverride !== null && p.saldoOverride !== undefined){
      running = round2(Number(p.saldoOverride));
    }
    p.saldo = running; // saldo restante ANTES do pagamento desta parcela
    running = round2(running - (Number(p.valorPago)||0));
  });
}
function loanCurrentBalance(loan){
  computeLoanSaldos(loan);
  const next = loan.parcelas.find(p=>!p.pago);
  if(next) return next.saldo;
  const last = loan.parcelas[loan.parcelas.length-1];
  return last ? round2(last.saldo - (Number(last.valorPago)||0)) : round2(Number(loan.saldoInicial)||0);
}

function cloneMonthFromModelo(){
  const novo = deepClone(DATA.template);
  // reseta o status de pago para o mês novo começar zerado
  [...novo.dia18, ...novo.dia08].forEach(it=>it.pago=false);
  (novo.detalhamentos||[]).forEach(det=>det.items.forEach(it=>it.pago=false));
  return novo;
}

function addMonth(){
  const modal = document.getElementById('add-month-modal');
  const yearInput = document.getElementById('add-month-year');
  yearInput.value = new Date().getFullYear();
  document.getElementById('add-month-error').style.display = 'none';
  modal.style.display = 'flex';
  document.getElementById('add-month-select').focus();
}

function closeAddMonthModal(){
  document.getElementById('add-month-modal').style.display = 'none';
}

function confirmAddMonth(){
  const mesNome = document.getElementById('add-month-select').value;
  const ano = parseInt(document.getElementById('add-month-year').value, 10);
  const errorEl = document.getElementById('add-month-error');
  if(!ano || ano < 2000 || ano > 2100){
    errorEl.textContent = 'Digite um ano válido.';
    errorEl.style.display = 'block';
    return;
  }
  const nomeCompleto = `${mesNome}/${ano}`;
  const jaExiste = Object.keys(DATA.months).some(k => k.trim().toLowerCase() === nomeCompleto.toLowerCase());
  if(jaExiste){
    errorEl.textContent = 'Já existe um mês com esse nome.';
    errorEl.style.display = 'block';
    return;
  }
  DATA.months[nomeCompleto] = cloneMonthFromModelo();
  DATA.monthOrder.push(nomeCompleto);
  save();
  currentTab = nomeCompleto;
  closeAddMonthModal();
  renderTabs();
  renderContent();
}

function deleteMonth(monthKey){
  if(!confirm(`Excluir o mês "${monthKey}"? Essa ação não pode ser desfeita.`)) return;
  delete DATA.months[monthKey];
  DATA.monthOrder = DATA.monthOrder.filter(m=>m!==monthKey);
  save();
  currentTab = DATA.monthOrder[0] || "Empréstimos";
  renderTabs();
  renderContent();
}
let pendingSaves = 0;
window.addEventListener('beforeunload', e=>{
  if(pendingSaves > 0){
    e.preventDefault();
    e.returnValue = '';
  }
});

function setSaveStatus(state){
  const el = document.getElementById('save-status');
  if(!el) return;
  el.classList.remove('saving','saved','error');
  if(state === 'saving'){
    el.textContent = 'salvando...';
    el.classList.add('show','saving');
  } else if(state === 'saved'){
    el.textContent = 'salvo ✓';
    el.classList.add('show','saved');
    clearTimeout(setSaveStatus._t);
    setSaveStatus._t = setTimeout(()=>{ el.classList.remove('show'); }, 2000);
  } else if(state === 'error'){
    el.textContent = '⚠ não foi possível salvar — tente de novo';
    el.classList.add('show','error');
  }
}

async function save(){
  pendingSaves++;
  setSaveStatus('saving');
  try{
    const resp = await fetch(`${API_BASE}/api/data/${APP_ID}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-app-password': currentPassword },
      body: JSON.stringify(DATA)
    });
    if(!resp.ok) throw new Error('Resposta não OK: ' + resp.status);
    setSaveStatus('saved');
  }catch(e){
    console.error('Falha ao salvar dados no servidor', e);
    setSaveStatus('error');
    alert('Não foi possível salvar as alterações no servidor agora. Verifique sua internet e tente novamente.');
  }finally{
    pendingSaves--;
  }
}

async function initApp(){
  try{
    DATA = await loadFromServer();
    currentTab = DATA.monthOrder[0] || "Empréstimos";
    dataReady = true;
    renderTabs();
    renderContent();
    return { ok:true };
  }catch(e){
    console.error('Falha ao carregar dados do servidor', e);
    if(e.isAuthError) return { ok:false, erro:'senha' };
    return { ok:false, erro:'conexao' };
  }
}
function fmt(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function round2(v){
  const n = Number(v);
  if(isNaN(n)) return 0;
  return Math.round((n + Number.EPSILON) * 100) / 100;
}
function sortItemsByDesc(list){
  list.sort((a,b)=>String(a.desc).localeCompare(String(b.desc), 'pt-BR', {sensitivity:'base'}));
}
function nomeDuplicado(list, desc, excludeIdx){
  const alvo = String(desc).trim().toLowerCase();
  return list.some((it,idx)=> idx !== excludeIdx && String(it.desc).trim().toLowerCase() === alvo);
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const allTabs = [...DATA.monthOrder, "Modelo", "Resumo Anual", "Empréstimos"];
  tabs.innerHTML = allTabs.map(t =>
    `<button class="${t===currentTab?'active':''} ${t==="Modelo"?'tab-modelo':''}" data-tab="${t}" ${DATA.monthOrder.includes(t) ? 'draggable="true"' : ''}>${t}</button>`
  ).join('') + `<button id="add-month-tab" title="Criar novo mês a partir do Modelo">+ Novo Mês</button>`;
  tabs.querySelectorAll('button[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; renderTabs(); renderContent(); });
  });
  tabs.querySelector('#add-month-tab').addEventListener('click', addMonth);
  initTabDragReorder(tabs);
}

function initTabDragReorder(tabs){
  let draggedTab = null;
  tabs.querySelectorAll('button[draggable="true"]').forEach(btn=>{
    btn.addEventListener('dragstart', e=>{
      draggedTab = btn.dataset.tab;
      btn.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    btn.addEventListener('dragend', ()=>{
      btn.classList.remove('dragging');
      tabs.querySelectorAll('button').forEach(b=>b.classList.remove('drag-over'));
    });
    btn.addEventListener('dragover', e=>{
      if(!draggedTab || !DATA.monthOrder.includes(btn.dataset.tab)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      btn.classList.add('drag-over');
    });
    btn.addEventListener('dragleave', ()=>{ btn.classList.remove('drag-over'); });
    btn.addEventListener('drop', e=>{
      e.preventDefault();
      btn.classList.remove('drag-over');
      const targetTab = btn.dataset.tab;
      if(!draggedTab || !DATA.monthOrder.includes(targetTab) || draggedTab === targetTab) return;
      const from = DATA.monthOrder.indexOf(draggedTab);
      const to = DATA.monthOrder.indexOf(targetTab);
      if(from === -1 || to === -1) return;
      DATA.monthOrder.splice(from,1);
      DATA.monthOrder.splice(to,0,draggedTab);
      save();
      renderTabs();
    });
  });
}

function renderContent(){
  const content = document.getElementById('content');
  if(currentTab === "Modelo"){
    content.innerHTML = renderMonthView("Modelo");
    attachMonthEvents("Modelo");
  } else if(DATA.monthOrder.includes(currentTab)){
    content.innerHTML = renderMonthView(currentTab);
    attachMonthEvents(currentTab);
  } else if(currentTab === "Empréstimos"){
    content.innerHTML = renderEmprestimosView();
    attachEmprestimosEvents();
  } else if(currentTab === "Resumo Anual"){
    content.innerHTML = renderResumoAnualView();
  }
}

    if(!det.linkTo) return;
    if(m.blocosOcultos && m.blocosOcultos[det.linkTo.list]) return; // bloco excluído — não recria o item
    const total = round2(det.items.reduce((s,x)=>s+Number(x.valor||0),0));
    const list = m[det.linkTo.list];
    if(!list) return;
    const descNorm = det.linkTo.desc.trim().toLowerCase();
    const matches = list.filter(it=>String(it.desc).trim().toLowerCase() === descNorm);
    if(matches.length > 0){
      // mantém só o primeiro encontrado e atualiza o valor; remove duplicados (se houver)
      matches[0].valor = total;
      for(let i=1;i<matches.length;i++){
        const idx = list.indexOf(matches[i]);
        if(idx !== -1) list.splice(idx,1);
      }
    } else {
      list.push({ desc: det.linkTo.desc, valor: total, pago:false });
    }
  });
}

function limparBlocosExcluidos(m){
  if(!m.blocosOcultos) return;
  Object.keys(m.blocosOcultos).forEach(key=>{
    if(m.blocosOcultos[key] && m[key] && m[key].length > 0){
      m[key] = [];
    }
  });
}

function monthTotals(m){
  limparBlocosExcluidos(m);
  syncDetailsIntoMain(m);
  const dia18Total = round2(m.dia18.reduce((s,x)=>s+Number(x.valor||0),0));
  const dia08Total = round2(m.dia08.reduce((s,x)=>s+Number(x.valor||0),0));
  const despesasTotal = round2(dia18Total + dia08Total);
  const rendaTotal = round2(Number(m.recebimentos.dia18||0) + Number(m.recebimentos.dia08||0));
  const saldo = round2(rendaTotal - despesasTotal);
  const pago = round2([...m.dia18, ...m.dia08].filter(x=>x.pago).reduce((s,x)=>s+Number(x.valor||0),0));
  const pendente = round2(despesasTotal - pago);
  return { dia18Total, dia08Total, despesasTotal, rendaTotal, saldo, pago, pendente };
}

function comparativoTexto(atual, anterior, aumentoEBom){
  if(!anterior || anterior === 0) return '';
  const diff = atual - anterior;
  const pct = (diff/anterior)*100;
  if(Math.abs(pct) < 0.5) return `<div class="comparativo" style="color:var(--muted);">· igual ao mês anterior</div>`;
  const seta = diff>0 ? '↑' : '↓';
  const aumentouEhBom = aumentoEBom ? diff>0 : diff<0;
  const cor = aumentouEhBom ? 'var(--green)' : 'var(--red)';
  return `<div class="comparativo" style="color:${cor};">${seta} ${Math.abs(pct).toFixed(0)}% vs mês anterior</div>`;
}

    <div class="summary-card accent-green"><div class="label">Pago</div><div class="value">R$ ${fmt(t.pago)}</div></div>

function attachMonthEvents(monthKey){
  const isTemplate = monthKey === "Modelo";
  const m = isTemplate ? DATA.template : DATA.months[monthKey];
  const content = document.getElementById('content');

  if(!isTemplate){
    const delBtn = content.querySelector('#delete-month-btn');
    if(delBtn) delBtn.addEventListener('click', ()=>deleteMonth(monthKey));
  }

  const titleInput = content.querySelector('#month-title-input');
  if(titleInput){
    titleInput.addEventListener('change', e=>{
      const novoNome = e.target.value.trim();
      if(!novoNome || novoNome === monthKey){
        e.target.value = monthKey;
        return;
      }
      const duplicado = Object.keys(DATA.months).some(k => k !== monthKey && k.trim().toLowerCase() === novoNome.toLowerCase());
      if(duplicado){
        alert('Já existe um mês com esse nome.');
        e.target.value = monthKey;
        return;
      }
      DATA.months[novoNome] = DATA.months[monthKey];
      delete DATA.months[monthKey];
      DATA.monthOrder = DATA.monthOrder.map(k => k === monthKey ? novoNome : k);
      currentTab = novoNome;
      save();
      renderTabs();
      renderContent();
    });
  }

  const receb18El = content.querySelector('#receb-dia18');
  if(receb18El) receb18El.addEventListener('change', e=>{
    m.recebimentos.dia18 = round2(parseFloat(e.target.value)||0); save(); renderContent();
  });
  const receb08El = content.querySelector('#receb-dia08');
  if(receb08El) receb08El.addEventListener('change', e=>{
    m.recebimentos.dia08 = round2(parseFloat(e.target.value)||0); save(); renderContent();
  });

  // labels editáveis (Recebimento · Dia 18/08, títulos das seções DIA 18/08)
  content.querySelectorAll('.rlabel-input[data-label-key], .section-title-input[data-label-key]').forEach(el=>{
    el.addEventListener('change', e=>{
      const key = el.dataset.labelKey;
      const valorPadrao = {
        recebDia18: "Recebimento · Dia 18",
        recebDia08: "Recebimento · Dia 08",
        secaoDia18: "DIA 18 · Vencimentos",
        secaoDia08: "DIA 08 · Vencimentos",
      }[key];
      if(!m.labels) m.labels = {};
      m.labels[key] = e.target.value.trim() || valorPadrao;
      save(); renderContent();
    });
  });

  // excluir bloco inteiro (dia18 / dia08)
  content.querySelectorAll('.block-remove[data-block]').forEach(btn=>{
    const listKey = btn.dataset.block;
    btn.addEventListener('click', ()=>{
      const label = listKey === 'dia18' ? 'Dia 18' : 'Dia 08';
      if(!confirm(`Excluir o bloco "${label}" deste mês? Os itens e o recebimento desse bloco serão zerados. Você pode trazer o bloco de volta depois, mas vazio.`)) return;
      if(!m.blocosOcultos) m.blocosOcultos = { dia18:false, dia08:false };
      m.blocosOcultos[listKey] = true;
      m[listKey] = [];
      m.recebimentos[listKey] = 0;
      save(); renderContent();
    });
  });

  // restaurar bloco oculto
  content.querySelectorAll('.block-restore[data-restore]').forEach(btn=>{
    const listKey = btn.dataset.restore;
    btn.addEventListener('click', ()=>{
      m.blocosOcultos[listKey] = false;
      save(); renderContent();
    });
  });

  // excluir bloco de detalhamento (REVOLUT / NOH)
  content.querySelectorAll('.block-remove[data-detail-idx]').forEach(btn=>{
    const dIdx = parseInt(btn.dataset.detailIdx,10);
    btn.addEventListener('click', ()=>{
      const titulo = m.detalhamentos[dIdx] ? m.detalhamentos[dIdx].titulo : 'este bloco';
      if(!confirm(`Excluir o bloco "${titulo}"? Essa ação não pode ser desfeita.`)) return;
      m.detalhamentos.splice(dIdx,1);
      save(); renderContent();
    });
  });

  // main sections (dia18 / dia08)
  content.querySelectorAll('.section-card[data-section]').forEach(card=>{
    const listKey = card.dataset.section;
    const list = m[listKey];

    card.querySelectorAll('.item-row').forEach(row=>{
      const idx = parseInt(row.dataset.idx,10);
      row.querySelector('.chk-pago').addEventListener('change', e=>{
        list[idx].pago = e.target.checked; save(); renderContent();
      });
      row.querySelector('.item-desc').addEventListener('change', e=>{
        const novoDesc = e.target.value.trim();
        if(nomeDuplicado(list, novoDesc, idx)){
          alert('Já existe um item com esse nome neste bloco.');
          e.target.value = list[idx].desc;
          return;
        }
        list[idx].desc = novoDesc; save(); renderContent();
      });
      row.querySelector('.item-valor').addEventListener('change', e=>{
        list[idx].valor = round2(parseFloat(e.target.value)||0); save(); renderContent();
      });
      row.querySelector('.item-remove').addEventListener('click', ()=>{
        if(!confirm(`Remover "${list[idx].desc}"?`)) return;
        list.splice(idx,1); save(); renderContent();
      });
    });

    const addRow = card.querySelector('.add-item-row');
    addRow.querySelector('.btn-add').addEventListener('click', ()=>{
      const desc = addRow.querySelector('.add-desc').value.trim();
      const valor = round2(parseFloat(addRow.querySelector('.add-valor').value)||0);
      if(!desc){ addRow.querySelector('.add-desc').focus(); return; }
      if(nomeDuplicado(list, desc)){
        alert('Já existe um item com esse nome neste bloco.');
        addRow.querySelector('.add-desc').focus();
        return;
      }
      list.push({ desc, valor, pago:false });
      sortItemsByDesc(list);
      save(); renderContent();
      if(confirm(`Adicionar "${desc}" também neste bloco em todos os outros meses (e no Modelo)?`)){
        let count = 0;
        todosOsMesesETemplate().forEach(mes=>{
          if(mes === m) return;
          const listCorrespondente = mes[listKey];
          if(listCorrespondente && !nomeDuplicado(listCorrespondente, desc)){
            listCorrespondente.push({ desc, valor, pago:false });
            sortItemsByDesc(listCorrespondente);
            count++;
          }
        });
        alert(`Item adicionado em mais ${count} mês(es)/Modelo.`);
        save(); renderContent();
      }
    });
  });

  // detail sections
  content.querySelectorAll('.section-card[data-detail]').forEach(card=>{
    const dIdx = parseInt(card.dataset.detail,10);
    const detail = m.detalhamentos[dIdx];

    card.querySelector('.detail-title-input').addEventListener('change', e=>{
      detail.titulo = e.target.value; save(); renderContent();
    });

    card.querySelectorAll('.item-row').forEach(row=>{
      const idx = parseInt(row.dataset.idx,10);
      row.querySelector('.chk-pago').addEventListener('change', e=>{
        detail.items[idx].pago = e.target.checked; save(); renderContent();
      });
      row.querySelector('.item-desc').addEventListener('change', e=>{
        const novoDesc = e.target.value.trim();
        if(nomeDuplicado(detail.items, novoDesc, idx)){
          alert('Já existe um item com esse nome neste detalhamento.');
          e.target.value = detail.items[idx].desc;
          return;
        }
        detail.items[idx].desc = novoDesc; save(); renderContent();
      });
      row.querySelector('.item-valor').addEventListener('change', e=>{
        detail.items[idx].valor = round2(parseFloat(e.target.value)||0);
        syncDetailsIntoMain(m); save(); renderContent();
      });
      row.querySelector('.item-remove').addEventListener('click', ()=>{
        if(!confirm(`Remover "${detail.items[idx].desc}"?`)) return;
        detail.items.splice(idx,1);
        syncDetailsIntoMain(m); save(); renderContent();
      });
    });

    const addRow = card.querySelector('.add-item-row');
    addRow.querySelector('.btn-add').addEventListener('click', ()=>{
      const desc = addRow.querySelector('.add-desc').value.trim();
      const valor = round2(parseFloat(addRow.querySelector('.add-valor').value)||0);
      if(!desc){ addRow.querySelector('.add-desc').focus(); return; }
      if(nomeDuplicado(detail.items, desc)){
        alert('Já existe um item com esse nome neste detalhamento.');
        addRow.querySelector('.add-desc').focus();
        return;
      }
      detail.items.push({ desc, valor, pago:false });
      sortItemsByDesc(detail.items);
      syncDetailsIntoMain(m);
      save(); renderContent();
      if(confirm(`Adicionar "${desc}" também no detalhamento "${detail.titulo}" de todos os outros meses (e do Modelo)?`)){
        const tituloAlvo = detail.titulo.trim().toLowerCase();
        let count = 0;
        todosOsMesesETemplate().forEach(mes=>{
          if(mes === m) return;
          const detCorrespondente = (mes.detalhamentos||[]).find(d=>d.titulo.trim().toLowerCase() === tituloAlvo);
          if(detCorrespondente && !nomeDuplicado(detCorrespondente.items, desc)){
            detCorrespondente.items.push({ desc, valor, pago:false });
            sortItemsByDesc(detCorrespondente.items);
            syncDetailsIntoMain(mes);
            count++;
          }
        });
        alert(`Item adicionado em mais ${count} detalhamento(s) "${detail.titulo}".`);
        save(); renderContent();
      }
    });
  });
}

function renderBarChart(items, chartId){
  const w = 700, h = 220, padding = 30;
  const maxVal = Math.max(1, ...items.map(i=>i.value));
  const gap = (w - padding*2) / Math.max(1, items.length);
  const barWidth = Math.min(60, gap * 0.6);
  let bars = '';
  items.forEach((it, idx)=>{
    const barH = Math.round((it.value / maxVal) * (h - 70));
    const x = padding + idx*gap + (gap-barWidth)/2;
    const y = h - 40 - barH;
    bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${barWidth.toFixed(1)}" height="${Math.max(barH,1)}" rx="4" fill="url(#${chartId})"></rect>`;
    bars += `<text x="${(x+barWidth/2).toFixed(1)}" y="${y-6}" text-anchor="middle" font-size="10" fill="#6B7684" font-weight="700">${fmt(it.value)}</text>`;
    bars += `<text x="${(x+barWidth/2).toFixed(1)}" y="${h-20}" text-anchor="middle" font-size="10" fill="#6B7684">${escapeHtml(it.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${chartId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12A9A6"/><stop offset="100%" stop-color="#2F6FED"/>
    </linearGradient></defs>
    <line x1="${padding}" y1="${h-40}" x2="${w-padding}" y2="${h-40}" stroke="#E4E8EE" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function renderResumoAnualView(){

    if(!m) return;

    const partes = key.split('/');
    const mes = partes[0] || key;
    const ano = partes[1] || '—';
    if(!grupos[ano]) grupos[ano] = [];
    grupos[ano].push({ key, mes, t });
  });

  const anos = Object.keys(grupos).sort();
  if(anos.length === 0) return `<div class="empty-hint">Nenhum mês cadastrado ainda.</div>`;

  let html = '';
  anos.forEach(ano=>{
    const meses = grupos[ano];
    const totalRenda = round2(meses.reduce((s,x)=>s+x.t.rendaTotal,0));
    const totalDespesas = round2(meses.reduce((s,x)=>s+x.t.despesasTotal,0));
    const totalSaldo = round2(totalRenda - totalDespesas);

    const rows = meses.map(x=>`
      <tr>
        <td>${escapeHtml(x.mes)}</td>
        <td class="num">R$ ${fmt(x.t.rendaTotal)}</td>
        <td class="num">R$ ${fmt(x.t.despesasTotal)}</td>
        <td class="num ${x.t.saldo>=0?'num-positive':'num-negative'}">R$ ${fmt(x.t.saldo)}</td>
      </tr>`).join('');

    const chart = renderBarChart(meses.map(x=>({label:x.mes, value:x.t.despesasTotal})), `chart-${ano}`);

    html += `
    <div class="section-card annual-card">
      <div class="section-header"><h3>ano ${ano}</h3></div>
      <div class="annual-chart-wrap">${chart}</div>
      <table class="annual-table">
        <thead><tr><th>mês</th><th class="num">renda</th><th class="num">despesas</th><th class="num">saldo</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>total</td>
          <td class="num">R$ ${fmt(totalRenda)}</td>
          <td class="num">R$ ${fmt(totalDespesas)}</td>
          <td class="num ${totalSaldo>=0?'num-positive':'num-negative'}">R$ ${fmt(totalSaldo)}</td>
        </tr></tfoot>
      </table>
    </div>`;
  });
  return html;
}

function attachEmprestimosEvents(){
  const content = document.getElementById('content');
  content.querySelectorAll('.loan-card').forEach(card=>{
    const key = card.dataset.loan;
    const loan = DATA.emprestimos[key];

    card.querySelector('.loan-title-input').addEventListener('change', e=>{
      loan.titulo = e.target.value.trim() || loan.titulo; save(); renderContent();
    });

    card.querySelector('.loan-saldo-inicial').addEventListener('change', e=>{
      loan.saldoInicial = round2(parseFloat(e.target.value)||0); save(); renderContent();
    });

    card.querySelectorAll('tbody tr').forEach(tr=>{
      const idx = parseInt(tr.dataset.idx,10);
      const p = loan.parcelas[idx];
      tr.querySelector('.loan-parcela').addEventListener('change', e=>{ p.parcela = e.target.value; save(); });
      tr.querySelector('.loan-saldo').addEventListener('change', e=>{
        p.saldoOverride = e.target.value === '' ? null : round2(parseFloat(e.target.value));
        save(); renderContent();
      });
      tr.querySelector('.loan-valorpago').addEventListener('change', e=>{
        const val = e.target.value === '' ? null : round2(parseFloat(e.target.value));
        p.valorPago = val;
        // marca automaticamente como pago quando um valor é informado, e desmarca quando é apagado
        p.pago = val !== null;
        save(); renderContent();
      });
      tr.querySelector('.loan-data').addEventListener('change', e=>{ p.data = e.target.value || null; save(); });
      tr.querySelector('.loan-remove').addEventListener('click', ()=>{
        if(!confirm(`Remover "${p.parcela}"?`)) return;
        loan.parcelas.splice(idx,1); save(); renderContent();
      });
    });

    card.querySelector('.loan-add-btn').addEventListener('click', ()=>{
      loan.parcelas.push({ parcela: `Parcela ${String(loan.parcelas.length+1).padStart(2,'0')}`, valorPago:null, data:null, pago:false, saldoOverride:null });
      save(); renderContent();
    });
  });
}

// ============================= UTIL =============================
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ============================= EXPORTAR / IMPORTAR =============================
function exportData(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataHoje = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `controle-gastos-backup-${dataHoje}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    let imported;
    try{
      imported = JSON.parse(e.target.result);
    }catch(err){
      alert('Não foi possível ler esse arquivo. Confira se é um .json exportado por este app.');
      return;
    }
    if(!imported || typeof imported !== 'object' || !imported.months){
      alert('Esse arquivo não parece ser um backup válido deste app.');
      return;
    }
    if(!confirm('Importar esse arquivo vai substituir TODOS os dados salvos agora no servidor. Essa ação não pode ser desfeita. Continuar?')) return;
    DATA = migrateData(imported);
    save();
    currentTab = DATA.monthOrder[0] || "Empréstimos";
    renderTabs();
    renderContent();
    alert('Dados importados com sucesso!');
  };
  reader.onerror = () => alert('Erro ao ler o arquivo.');
  reader.readAsText(file);
}

function initExportImport(){
  document.getElementById('export-btn').addEventListener('click', exportData);
  const importBtn = document.getElementById('import-btn');
  const fileInput = document.getElementById('import-file-input');
  importBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', e=>{
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    fileInput.value = '';
  });
}

// ============================= SENHA =============================
const APP_PASSWORD = "238502";
function initLock(){
  const lockScreen = document.getElementById('lock-screen');
  const appRoot = document.getElementById('app-root');
  const input = document.getElementById('lock-input');
  const btn = document.getElementById('lock-btn');
  const errorMsg = document.getElementById('lock-error');
  const logoutBtn = document.getElementById('logout-btn');

  async function tryUnlock(){
    if(input.value !== APP_PASSWORD){
      errorMsg.textContent = 'Senha incorreta. Tente novamente.';
      errorMsg.style.color = '';
      errorMsg.style.display = 'block';
      input.value = '';
      input.focus();
      return;
    }
    currentPassword = input.value;
    btn.disabled = true;
    errorMsg.style.color = '#8A6A00';
    errorMsg.textContent = 'Carregando dados do servidor, aguarde...';
    errorMsg.style.display = 'block';

    const resultado = await initApp();

    btn.disabled = false;
    if(!resultado.ok){
      if(resultado.erro === 'senha'){
        errorMsg.textContent = 'Senha incorreta (o servidor recusou). Tente novamente.';
      } else {
        errorMsg.textContent = 'Não foi possível conectar ao servidor. Se ele estiver "dormindo" (plano gratuito), aguarde uns 30 segundos e tente de novo.';
      }
      errorMsg.style.color = '';
      input.value = '';
      input.focus();
      return;
    }
    errorMsg.style.display = 'none';
    lockScreen.style.display = 'none';
    appRoot.style.display = 'block';
  }
  function lock(){
    appRoot.style.display = 'none';
    lockScreen.style.display = 'flex';
    errorMsg.style.display = 'none';
    input.value = '';
    currentPassword = '';
    dataReady = false;
    input.focus();
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') tryUnlock(); });
  logoutBtn.addEventListener('click', lock);
  input.focus();
}
